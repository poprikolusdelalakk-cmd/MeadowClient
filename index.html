<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meadow Client | Premium Minecraft Cheat</title>
    <style>
        /* Общие премиум настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: #05070a;
            color: #f3f4f6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Живой анимированный фон (Сетка + Зелено-Бирюзовый Неон в стиле Meadow/Луг) */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow-1 {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: floatGlow 18s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(6%, 4%) scale(1.05); }
        }

        /* Навигационная панель (Стеклянный эффект) */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 8%;
            background: rgba(5, 7, 10, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .nav-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.02);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.25s ease;
        }

        .tab-btn:hover {
            color: #ffffff;
        }

        .tab-btn.active {
            color: #ffffff;
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        /* Секции контента */
        .content-section {
            display: none;
            padding: 80px 8%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .content-section.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ВКЛАДКА 1: ГЛАВНАЯ */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 20px;
        }

        .badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: 60px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        .hero h1 span {
            background: linear-gradient(135deg, #34d399, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #9ca3af;
            font-size: 18px;
            max-width: 700px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .btn-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 36px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .btn-gradient {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
        }

        .btn-gradient:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
            filter: brightness(1.05);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #22d3ee;
            color: #22d3ee;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
        }

        /* ВКЛАДКА 2: ФУНКЦИИ */
        .section-title {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .section-subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 50px;
            font-size: 16px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .feature-card {
            background: rgba(13, 17, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .feature-card:hover {
            transform: translateY(-5px);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.08);
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 20px;
            color: #34d399;
        }

        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .feature-card p {
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ВКЛАДКА 3: ЗАГРУЗКИ / МАГАЗИН */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px;
            max-width: 900px;
            margin: 0 auto;
        }

        .shop-card {
            background: rgba(13, 17, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .shop-card.premium-tier {
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.05);
        }

        .badge-premium {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #10b981, #06b6d4);
            color: #05070a;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .tier-name {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #9ca3af;
            letter-spacing: 1px;
        }

        .premium-tier .tier-name {
            color: #34d399;
        }

        .price-tag {
            font-size: 44px;
            font-weight: 900;
            margin: 20px 0;
        }

        .price-tag span {
            font-size: 16px;
            color: #6b7280;
            font-weight: 500;
        }

        .benefits-list {
            text-align: left;
            margin: 10px 0 35px 0;
            list-style: none;
}
.benefits-list li {
font-size: 14px;
color: #d1d5db;
margin-bottom: 12px;
display: flex;
align-items: center;
gap: 8px;
}
.benefits-list li::before {
content: "✓";
color: #34d399;
font-weight: bold;
}
/* Футер */
footer {
margin-top: auto;
text-align: center;
padding: 35px;
color: #4b5563;
font-size: 13px;
border-top: 1px solid rgba(255, 255, 255, 0.02);
}
@media (max-width: 768px) {
header { flex-direction: column; gap: 15px; padding: 15px; }
.hero h1 { font-size: 38px; }
.btn-group { flex-direction: column; width: 100%; }
.btn { width: 100%; }
.shop-grid { grid-template-columns: 1fr; }
}

function switchSection(sectionId) {
// 1. Скрываем абсолютно все секции с контентом
const sections = document.querySelectorAll('.content-section');
sections.forEach(sec => sec.classList.remove('active'));
// 2. Убираем активную подсветку со всех кнопок в меню шапки
const buttons = document.querySelectorAll('.tab-btn');
buttons.forEach(btn => btn.classList.remove('active'));
// 3. Показываем нужную вкладку по её ID
const targetSection = document.getElementById(sectionId);
if (targetSection) {
targetSection.classList.add('active');
}
// 4. Находим и подсвечиваем кнопку в меню, привязанную к этой вкладке
const currentButton = document.getElementById('tab-' + sectionId);
if (currentButton) {
currentButton.classList.add('active');
}
// 5. Прокручиваем страницу вверх, чтобы переключение выглядело красиво
window.scrollTo({ top: 0, behavior: 'smooth' });
}
